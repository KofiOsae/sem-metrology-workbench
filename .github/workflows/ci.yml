name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-native.txt
            requirements-build.txt
      - run: python -m pip install -r requirements-native.txt -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python examples/generate_validation_samples.py
      - run: python examples/validate_generated_samples.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: python -m pip install -r requirements-web.txt
      - run: python examples/generate_validation_samples.py
      - run: python -m py_compile web_app.py
      - name: Exercise browser service
        run: |
          uvicorn web_app:app --host 127.0.0.1 --port 8765 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/health && break
            sleep 1
          done
          curl --fail --silent --output /tmp/result.json \
            -F image=@examples/generated/02_vertical_grating.png \
            -F recipe=grating -F nm_per_px=5 -F min_size_nm=40 \
            -F max_size_nm=600 -F sensitivity=0.82 -F polarity=bright \
            -F orientation=vertical -F reject_border=true \
            http://127.0.0.1:8765/api/analyze
          python -c "import json; d=json.load(open('/tmp/result.json')); assert d['feature_count'] > 0; assert d['statistics']"
          curl --fail --silent --output /tmp/job.json \
            -F image=@examples/generated/02_vertical_grating.png \
            -F recipe=grating -F nm_per_px=5 -F min_size_nm=40 \
            -F max_size_nm=600 -F client_id=ci-anonymous-installation \
            http://127.0.0.1:8765/api/jobs
          job_id=$(python -c "import json; print(json.load(open('/tmp/job.json'))['job_id'])")
          for attempt in {1..120}; do
            curl --fail --silent --output /tmp/job-status.json "http://127.0.0.1:8765/api/jobs/$job_id"
            state=$(python -c "import json; print(json.load(open('/tmp/job-status.json'))['status'])")
            [ "$state" = complete ] && break
            [ "$state" = failed ] && cat /tmp/job-status.json && exit 1
            sleep 1
          done
          python -c "import json; d=json.load(open('/tmp/job-status.json')); assert d['status']=='complete'; assert d['result']['feature_count'] > 0"
          curl --fail --silent --output /tmp/cancel-job.json \
            -F image=@examples/generated/03_irregular_particles.png \
            -F recipe=particles -F nm_per_px=5 -F min_size_nm=20 \
            -F max_size_nm=1000 -F client_id=ci-cancelled \
            http://127.0.0.1:8765/api/jobs
          cancel_id=$(python -c "import json; print(json.load(open('/tmp/cancel-job.json'))['job_id'])")
          curl --fail --silent -X DELETE "http://127.0.0.1:8765/api/jobs/$cancel_id" | python -c "import sys,json; assert json.load(sys.stdin)['status']=='cancelled'"
          curl --fail --silent http://127.0.0.1:8765/api/usage | python -c "import sys,json; d=json.load(sys.stdin); assert 'persistent' in d"
