name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-native.txt -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python examples/generate_validation_samples.py
      - run: python examples/validate_generated_samples.py
