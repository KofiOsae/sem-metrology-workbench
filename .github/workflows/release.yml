name: windows-release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-native.txt -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python examples/generate_validation_samples.py
      - run: python examples/validate_generated_samples.py
      - run: python -m PyInstaller --noconfirm --clean SEM_Metrology_Native.spec
      - shell: pwsh
        run: |
          $source='dist/SEM Metrology Workbench.exe'
          $asset="dist/SEM-Metrology-Workbench-$env:GITHUB_REF_NAME-Windows-x64.exe"
          Copy-Item -LiteralPath $source -Destination $asset
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $asset)" | Set-Content -Encoding ascii 'dist/SHA256SUMS.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: sem-metrology-workbench-windows
          path: |
            dist/SEM-Metrology-Workbench-*-Windows-x64.exe
            dist/SHA256SUMS.txt
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --generate-notes --title "SEM Metrology Workbench $env:GITHUB_REF_NAME"
          gh release upload "$env:GITHUB_REF_NAME" dist/SEM-Metrology-Workbench-*-Windows-x64.exe dist/SHA256SUMS.txt
